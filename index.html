<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>カードバトルローグライク</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #ddd;
    font-family: monospace, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  h1 {
    font-size: 18px;
    margin: 12px 0 4px;
  }
  #app {
    width: 100%;
    max-width: 480px;
    padding: 0 12px 24px;
    box-sizing: border-box;
    display: none;
    flex-direction: column;
    align-items: center;
  }
  #menuOverlay {
    position: fixed;
    inset: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    box-sizing: border-box;
    z-index: 80;
  }
  #menuOverlay h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  #menuOverlay p {
    color: #999;
    font-size: 13px;
    margin: 0 0 22px;
  }
  #difficultyButtons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 280px;
  }
  .diffBtn {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 14px;
    background: #1b1b1b;
    border: 2px solid #555;
    border-radius: 10px;
    color: #eee;
    cursor: pointer;
    touch-action: manipulation;
    font-family: inherit;
  }
  .diffBtn:active {
    background: #2a2a2a;
  }
  .diffBtn[data-diff="easy"] { border-color: #66bb6a; }
  .diffBtn[data-diff="normal"] { border-color: #4fc3f7; }
  .diffBtn[data-diff="hard"] { border-color: #e05555; }
  .diffName {
    font-size: 16px;
    font-weight: bold;
  }
  .diffDesc {
    font-size: 11px;
    color: #999;
  }
  #stats {
    width: 100%;
    background: #1b1b1b;
    border: 1px solid #444;
    padding: 8px;
    margin-bottom: 12px;
    line-height: 1.6;
    box-sizing: border-box;
  }
  #stats span {
    color: #7fdbff;
  }
  #battleEnemy {
    text-align: center;
    margin-bottom: 14px;
  }
  #battleEnemyName {
    font-size: 18px;
    margin-bottom: 4px;
  }
  .hpBarOuter {
    width: 220px;
    max-width: 80vw;
    height: 14px;
    background: #333;
    border: 1px solid #555;
    border-radius: 7px;
    overflow: hidden;
    margin: 4px auto;
  }
  .hpBarInner {
    height: 100%;
    background: #e05555;
  }
  #battleEnemyIntent {
    color: #ffb74d;
    font-size: 13px;
    margin-top: 4px;
  }
  #battlePlayer {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  #battlePlayer span {
    color: #7fdbff;
  }
  #log {
    width: 100%;
    height: 90px;
    overflow-y: auto;
    background: #1b1b1b;
    border: 1px solid #444;
    font-size: 12px;
    padding: 6px;
    margin-bottom: 14px;
    box-sizing: border-box;
  }
  #log div:last-child {
    color: #fff;
  }
  #hand {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    align-items: flex-start;
    /* Reserve room for a full 2-row hand so playing/discarding cards never
       shifts the End Turn button underneath a finger mid-tap. */
    min-height: 288px;
    margin-bottom: 16px;
  }
  .card {
    width: 92px;
    min-height: 120px;
    background: #22252b;
    border: 2px solid #666;
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
    position: relative;
    user-select: none;
  }
  .card.attack { border-color: #e05555; }
  .card.skill { border-color: #4fc3f7; }
  .card .cost {
    position: absolute;
    top: 4px;
    left: 4px;
    background: #333;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .card .cardName {
    font-size: 13px;
    margin-top: 22px;
    font-weight: bold;
  }
  .card .cardDesc {
    font-size: 11px;
    color: #bbb;
    margin-top: 6px;
  }
  .card.disabled {
    opacity: 0.4;
  }
  .card:active {
    transform: scale(0.96);
  }
  #battleControls button, #skipRewardBtn {
    padding: 10px 24px;
    font-size: 15px;
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #555;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #help {
    font-size: 12px;
    color: #888;
    margin-top: 4px;
    text-align: center;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    z-index: 60;
  }
  #overlayButtons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  #overlay button {
    padding: 8px 20px;
    font-size: 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #rewardOverlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 8, 16, 0.96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #eee;
    padding: 16px;
    box-sizing: border-box;
    overflow-y: auto;
    z-index: 50;
  }
  #rewardTitle {
    font-size: 16px;
    margin: 12px 0;
    text-align: center;
  }
  #rewardCards {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
<div id="menuOverlay">
  <h1>カードバトルローグライク</h1>
  <p>難易度を選んでスタート</p>
  <div id="difficultyButtons">
    <button class="diffBtn" data-diff="easy">
      <span class="diffName">かんたん</span>
      <span class="diffDesc">HP多め・敵弱め</span>
    </button>
    <button class="diffBtn" data-diff="normal">
      <span class="diffName">ふつう</span>
      <span class="diffDesc">標準バランス</span>
    </button>
    <button class="diffBtn" data-diff="hard">
      <span class="diffName">むずかしい</span>
      <span class="diffDesc">HP少なめ・敵強め</span>
    </button>
  </div>
</div>

<div id="app">
  <div id="stats"></div>

  <div id="battleEnemy">
    <div id="battleEnemyName"></div>
    <div class="hpBarOuter"><div id="battleEnemyHpBar" class="hpBarInner"></div></div>
    <div id="battleEnemyHpText"></div>
    <div id="battleEnemyIntent"></div>
  </div>

  <div id="battlePlayer">
    <div>HP: <span id="battlePlayerHp"></span></div>
    <div>ブロック: <span id="battlePlayerBlock"></span></div>
    <div>エネルギー: <span id="battlePlayerEnergy"></span></div>
  </div>

  <div id="log"></div>

  <div id="hand"></div>

  <div id="battleControls">
    <button id="endTurnBtn">ターン終了</button>
  </div>

  <div id="help">カードをタップして使用、敵を倒すと次の階層へ</div>
</div>

<div id="overlay">
  <div id="overlayText" style="font-size: 24px;"></div>
  <div id="overlayButtons">
    <button id="restartBtn">もう一度</button>
    <button id="titleBtn">タイトルへ戻る</button>
  </div>
</div>

<div id="rewardOverlay">
  <div id="rewardTitle">勝利！ カードを1枚選んでデッキに加える</div>
  <div id="rewardCards"></div>
  <button id="skipRewardBtn">スキップ</button>
</div>

<script src="game.js"></script>
</body>
</html>
